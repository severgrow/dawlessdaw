# Package a Mac installer for testing, or publish it when a version tag is pushed.
# electron-updater consumes the ZIP (+ latest-mac.yml) for in-app updates.
#
# Tag example: git tag v0.1.0 && git push origin v0.1.0
#
# Optional secrets for smoother Gatekeeper / auto-update:
#   CSC_LINK, CSC_KEY_PASSWORD — Apple Developer ID Application cert (base64 p12)
#   APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID — notarization
# Without a Developer ID, artifact-only builds use an ad-hoc signature for testing.

name: Desktop release (Mac)

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
    paths:
      - '.github/workflows/desktop-release.yml'
      - 'apps/desktop/package.json'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build only and attach the installer to this workflow run'
        required: false
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      - name: Build web for desktop shell
        run: npm run build:desktop

      - name: Package Mac (DMG + ZIP)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLISH_MODE: ${{ (github.ref_type == 'tag' || (github.event_name == 'workflow_dispatch' && !inputs.dry_run)) && 'always' || 'never' }}
          # Use Developer ID signing when configured.
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # GitHub exports missing secrets as empty strings. The packager reads
          # an empty certificate path as the current directory.
          for credential in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!credential}" ]; then
              unset "$credential"
            fi
          done
          signing_args=()
          if [ -z "${CSC_LINK:-}" ]; then
            if [ "$PUBLISH_MODE" = always ]; then
              echo "::error::Publishing a Mac release requires a Developer ID Application certificate (CSC_LINK)."
              exit 1
            fi
            # Sign the entire Electron bundle after packaging, including helpers.
            # Developer ID builds keep the hardened runtime enabled for notarization.
            signing_args=(-c.mac.identity=- -c.mac.hardenedRuntime=false -c.mac.notarize=false)
          fi
          npm run dist:mac -w @dawlessdaw/desktop -- --arm64 --x64 --publish "$PUBLISH_MODE" "${signing_args[@]}"

      - name: Verify apps inside disk images
        shell: bash
        run: |
          set -euo pipefail
          for image in apps/desktop/release/*.dmg; do
            hdiutil verify "$image"
            mount_dir=$(mktemp -d)
            hdiutil attach "$image" -readonly -nobrowse -mountpoint "$mount_dir"
            trap 'hdiutil detach "$mount_dir"' EXIT
            codesign --verify --deep --strict --verbose=2 "$mount_dir/Splot MIDI Brain.app"
            hdiutil detach "$mount_dir"
            trap - EXIT
            rmdir "$mount_dir"
          done

      - name: Attach test installers
        if: github.ref_type != 'tag' && (github.event_name != 'workflow_dispatch' || inputs.dry_run)
        uses: actions/upload-artifact@v4
        with:
          name: Splot-Mac-installers
          path: apps/desktop/release/*.dmg
          if-no-files-found: error
